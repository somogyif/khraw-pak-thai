# Netlify konfiguráció – Khraw Pak Thai
# A tényleges weboldal a site/ mappában van; a dokumentáció a repó gyökerében marad.

[build]
  publish = "site"

# Biztonsági fejlécek
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # Csak azok a források tölthetnek be, amiket ténylegesen használunk.
    # Bármi más (idegen script, beszúrt iframe, ismeretlen domain) blokkolva.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://scripts.simpleanalyticscdn.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://queue.simpleanalyticscdn.com; connect-src 'self' https://queue.simpleanalyticscdn.com; frame-src https://www.google.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests"
    # Az oldalnak nincs szüksége ezekre az eszközökre — tiltjuk.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()"

# Hosszú cache a statikus képekre (gyorsabb betöltés)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
