# Netlify konfiguráció – Khraw Pak Thai
# A tényleges weboldal a site/ mappában van; a dokumentáció a repó gyökerében marad.

[build]
  publish = "site"

# Biztonsági fejlécek
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Hosszú cache a statikus képekre (gyorsabb betöltés)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
