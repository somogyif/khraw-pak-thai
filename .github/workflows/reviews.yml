name: Update reviews

on:
  schedule:
        - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Friss értékelések lekérése
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: python3 scripts/update-reviews.py
      - name: Audit az élesítés előtt
        run: python3 tests/audit.py
      - name: Commit, ha változott
        run: |
          if git diff --quiet -- site/index.html; then
            echo "Nincs új vélemény — nincs teendő."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "Frissített Google-értékelések [automatikus]"
          git push
