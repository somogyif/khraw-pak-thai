name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  static:
    name: Statikus audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 tests/audit.py

  render:
    name: Renderelési ellenőrzés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Ez a projekt egyetlen fejlesztői függősége. A kiszállított oldal
      # továbbra is nulla függőségű — a látogató ebből semmit nem tölt le.
      # Azért kell, mert a statikus audit szövegként olvassa a fájlokat, és a
      # renderelési hibákat (lang, alt, fókusz, eltűnt mező) elvileg nem látja.
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python3 tests/render-check.py

  live:
    name: Élő oldal ellenőrzése
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Státuszkódok, átirányítások, biztonsági fejlécek, sitemap, robots.
      - run: bash tests/live-check.sh khrawpakthai.com
      # És ugyanaz a renderelési ellenőrzés, de az ÉLES oldalon: ez fogja meg
      # az elrontott deployt és az elmozdult Netlify-beállítást.
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python3 tests/render-check.py https://khrawpakthai.com
