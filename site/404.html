<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--green:#14402a;--gold:#d8b45c;--cream:#f6efdf}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;
    background:var(--green);color:var(--cream);text-align:center;
    font-family:'Karla',system-ui,sans-serif;line-height:1.6;
  }
  .logo{height:64px;width:auto;margin:0 auto 32px}
  h1{font-family:'Poppins',system-ui,sans-serif;font-weight:800;font-size:clamp(2rem,6vw,3rem);color:#fff;margin:0 0 12px}
  p{color:#e9e3d0;margin:0 0 32px;max-width:32em}
  .actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
  .btn{
    display:inline-flex;align-items:center;font-family:'Poppins',system-ui,sans-serif;font-weight:600;
    padding:.85em 1.6em;border-radius:999px;text-decoration:none;border:2px solid var(--gold);
    transition:background .2s,color .2s;
  }
  .btn-gold{background:var(--gold);color:#0e2e1e}
  .btn-gold:hover{background:#c69f45}
  .btn-outline{color:var(--cream)}
  .btn-outline:hover{background:var(--gold);color:#0e2e1e}
  :focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .small{margin-top:36px;font-size:.85rem;color:#b9b3a0}
</style>
</head>

  <main>

    <div class="actions">
      <a class="btn btn-gold" href="/">Vissza a kezdőlapra</a>
      <a class="btn btn-outline" href="/#menu">Étlap</a>
      <a class="btn btn-outline" href="tel:+36706168263">+36 70 616 8263</a>
    </div>

</body>
